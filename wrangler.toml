name = "encrypted-voice"
pages_build_output_dir = "./public"
compatibility_date = "2024-11-01"

# Cloudflare KV untuk sinkronisasi (opsional).
# 1) npx wrangler kv namespace create VOICE_NOTES
# 2) ganti id di bawah dengan id yang muncul
[[kv_namespaces]]
binding = "VOICE_NOTES"
id = "490486a212de40238fe4921becaa7fe6"

# ACCESS_TOKEN JANGAN ditulis di sini. Set sebagai secret:
#   npx wrangler pages secret put ACCESS_TOKEN --project-name encrypted-voice
# Untuk lokal, taruh di file .dev.vars (lihat .dev.vars.example)
